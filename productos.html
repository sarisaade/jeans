/* =========================
   TOPBAR
========================= */

.topbar{

  position:fixed;

  top:0;
  left:0;

  width:100%;

  height:38px;

  z-index:10000;

  background:#061426;

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:40px;

  flex-wrap:wrap;

  font-size:13px;

  letter-spacing:1px;
}

.navbar{

  position:fixed;

  top:34px;

  left:0;

  width:100%;

  margin-top:-1px;

  z-index:9999;

  background:rgba(255,255,255,.94);

  backdrop-filter:blur(10px);

  padding:22px 40px;

  display:grid;

  grid-template-columns:1fr auto 1fr;

  align-items:center;

  transition:.3s ease;

  box-shadow:0 4px 20px rgba(0,0,0,.05);
}


.logo{
  justify-self:center;

  font-family:'Cormorant Garamond',serif;

  font-size:54px;

  font-weight:600;

  letter-spacing:2px;
}

.nav-links{
  display:flex;
  gap:28px;
  font-size:14px;
  text-transform:uppercase;
}

.icons{
  display:flex;
  gap:20px;
  font-size:20px;
  justify-self:end;
}
.cart{
  position:relative;

  font-size:22px;

  transition:.3s ease;

  cursor:pointer;
}

.cart:hover{
  transform:scale(1.1);
  color:#c89a68;
}

  }

    font-size:32px;

  }

  .icons{
    justify-self:center;
  }
  }

  </style>

<script src="./script.js"></script>


<script>

window.addEventListener("load", () => {

  const params =
  new URLSearchParams(window.location.search);

  const categoria =
  params.get("cat");

  if(!categoria) return;

  const filtrar = setInterval(() => {

    const cards =
    document.querySelectorAll(".product-card");

    if(cards.length === 0) return;

    cards.forEach(card => {

      const tituloEl =
      card.querySelector("h2");

      if(!tituloEl) return;

      const titulo =
      tituloEl.textContent.toLowerCase();

      let mostrar = false;

      // 👉 JEANS
      if(categoria === "jeans"){

        if(
          titulo.includes("jean") ||
          titulo.includes("denim")
        ){
          mostrar = true;
        }

      }

      // 👉 SWEATERS
      if(categoria === "sweaters"){

        if(
          titulo.includes("sweater") ||
          titulo.includes("buzo") ||
          titulo.includes("tricot")
        ){
          mostrar = true;
        }

      }

      card.style.display =
      mostrar ? "block" : "none";

    });

    clearInterval(filtrar);

  }, 500);

});

</script>

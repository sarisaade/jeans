<script>
    function toggleTalles() {
        var content = document.getElementById("tallesContent");

    }
</script>
<script>
(function() {

  const track = document.querySelector(".home-track");
  const slides = document.querySelectorAll(".home-slide");

  if (!track || slides.length === 0) return;

  // 🔥 duplicamos imágenes
  track.innerHTML += track.innerHTML;

  let index = 0;
  const total = slides.length;

  setInterval(() => {
    index++;

    track.style.transition = "transform 0.8s ease-in-out";
    track.style.transform = `translateX(-${index * 100}%)`;

    // 🔁 cuando llega al final duplicado, resetea SIN animación
    if (index >= total) {
      setTimeout(() => {
        track.style.transition = "none";
        track.style.transform = "translateX(0)";
        index = 0;
      }, 800); // mismo tiempo que la transición
    }

  }, 3000);

})();
</script>
